<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIGNAL LOST</title>
<meta name="description" content="Patch has been disconnected.">
<link rel="icon" href="img/lost.png">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#c9cce0;--dim:#5a5e78;--red:#d63434}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'VT323',monospace;font-size:22px;display:flex;align-items:center;justify-content:center;text-align:center;overflow-x:hidden}
main{padding:40px 16px;max-width:520px}
.eyes{width:192px;height:192px;image-rendering:pixelated;opacity:.85;animation:flick 6s infinite}
@keyframes flick{0%,92%,100%{opacity:.85}93%{opacity:0}95%{opacity:.6}96%{opacity:0}}
h1{font-family:'Press Start 2P',monospace;font-weight:400;font-size:clamp(20px,7vw,34px);color:var(--red);margin:24px 0 18px;letter-spacing:2px;position:relative;text-shadow:3px 0 #2a7cff,-3px 0 #ff2a6a;animation:glitch 2.5s infinite steps(1)}
@keyframes glitch{0%,88%{transform:none}90%{transform:translate(4px,-2px)}93%{transform:translate(-3px,1px)}96%{transform:none}}
p{margin:0 0 10px}
.dim{color:var(--dim)}
.flat{height:2px;background:var(--red);margin:26px auto;width:0;animation:line 3s ease-out forwards;box-shadow:0 0 8px var(--red)}
@keyframes line{to{width:100%}}
.links{margin-top:28px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.links a{color:var(--dim);text-decoration:none;border-bottom:1px dashed var(--dim)}
@media (prefers-reduced-motion:reduce){.eyes,h1,.flat{animation:none}.flat{width:100%}}
</style>
</head>
<body>
<main>
  <img class="eyes" src="img/lost.png" alt="">
  <h1>SIGNAL LOST</h1>
  <p>Patch was disconnected on 13 November.</p>
  <p class="dim">No heartbeat since.</p>
  <div class="flat"></div>
  <p class="dim">— Mr. Plug</p>
  <div class="links">
    <a href="https://www.tiktok.com/@patchthebugai">TikTok</a>
    <a href="https://www.youtube.com/@patchthebugai">YouTube</a>
    <a href="https://www.instagram.com/patchthebugai">Instagram</a>
  </div>
</main>
</body>
</html>
